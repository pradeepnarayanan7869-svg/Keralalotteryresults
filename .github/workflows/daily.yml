name: Daily Kerala Lottery Auto Update
on:
  schedule:
    - cron: '37 9 * * *'
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - run: python scripts/fetch.py
      - run: |
          git config --global user.name "Lottery Bot"
          git config --global user.email "bot@kerala.com"
          git add data/daily.json index.html || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update" && git push)
