name: Daily Kerala Lottery Auto Update

on:
  schedule:
    - cron: '37 9 * * *'  # 3:07 PM IST
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests beautifulsoup4
      - name: Fetch result
        run: python scripts/fetch.py
      - name: Commit
        run: |
          git config --global user.name "Lottery Bot"
          git config --global user.email "bot@kerala.com"
          git add data/daily.json data/bumper.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update $(date +'%d/%m/%Y')" && git push)
